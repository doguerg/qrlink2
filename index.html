<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>06 DDV 196 - Škoda Kamiq İletişim Kartı</title>
    
    <!-- Meta Tags & PWA Theme -->
    <meta name="theme-color" content="#0b1329" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="06 DDV 196 Škoda Kamiq Araç İletişim Kartı">

    <style>
        :root {
            --bg-page: #090e1a;
            --bg-card: rgba(18, 26, 47, 0.88);
            --border-card: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-skoda: #10b981;
            --accent-skoda-glow: rgba(16, 185, 129, 0.25);
            --accent-call: #10b981;
            --accent-call-hover: #059669;
            --accent-wa: #25d366;
            --accent-wa-hover: #1eb956;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            --btn-shadow: 0 8px 20px -4px;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-page: #f1f5f9;
                --bg-card: rgba(255, 255, 255, 0.95);
                --border-card: rgba(0, 0, 0, 0.06);
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-muted: #94a3b8;
                --accent-skoda: #059669;
                --accent-skoda-glow: rgba(5, 150, 105, 0.15);
                --shadow-card: 0 20px 35px -10px rgba(0, 0, 0, 0.1);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-image: radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.12) 0%, transparent 65%);
        }

        .card-container {
            width: 100%;
            max-width: 410px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-card);
            border-radius: 28px;
            padding: 30px 22px;
            box-shadow: var(--shadow-card);
            text-align: center;
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 1. Status Badge (Pulsing Live Indicator) */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 14px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent-skoda);
            letter-spacing: 0.6px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulseGreen 2s infinite;
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* 4. Škoda Kamiq Automotive Header */
        .brand-section {
            margin-bottom: 18px;
        }

        .skoda-emblem-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 12px auto;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02));
            border: 1px solid rgba(255, 255, 255, 0.14);
            box-shadow: 0 8px 24px var(--accent-skoda-glow), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-skoda);
        }

        @media (prefers-color-scheme: light) {
            .skoda-emblem-wrap {
                background: linear-gradient(135deg, #ffffff, #f1f5f9);
                border-color: rgba(0, 0, 0, 0.08);
                color: #059669;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            }
        }

        .skoda-emblem-wrap svg {
            width: 42px;
            height: 42px;
        }

        .brand-name {
            font-size: 19px;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .model-name {
            display: inline-block;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 3.5px;
            color: var(--accent-skoda);
            text-transform: uppercase;
            margin-top: 3px;
        }

        /* 1 & 4. Hero License Plate Badge */
        .plate-wrapper {
            margin: 4px auto 18px auto;
            display: inline-block;
        }

        .plate-box {
            display: flex;
            align-items: center;
            background: #ffffff;
            color: #111827;
            border: 2px solid #1f2937;
            border-radius: 9px;
            padding: 4px 14px 4px 6px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
            user-select: none;
        }

        .plate-tr {
            background: #003399;
            color: #ffffff;
            font-weight: 800;
            font-size: 11px;
            border-radius: 4px;
            padding: 5px 6px 3px 6px;
            margin-right: 12px;
            letter-spacing: 0.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1;
        }

        .plate-tr span {
            font-size: 8px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        .plate-number {
            font-size: 21px;
            font-weight: 900;
            letter-spacing: 2.5px;
            font-family: 'Arial Black', -apple-system, sans-serif;
            text-transform: uppercase;
        }

        /* Info & Courtesy Notice */
        .notice-box {
            background: rgba(148, 163, 184, 0.07);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.45;
            color: var(--text-secondary);
            margin-bottom: 24px;
        }

        /* Action Buttons Area */
        .actions-list {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            border-radius: 18px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }

        .btn-icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-icon-wrap svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .btn-text-wrap {
            display: flex;
            flex-direction: column;
        }

        .btn-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .btn-desc {
            font-size: 12px;
            opacity: 0.9;
            font-weight: 400;
            margin-top: 2px;
        }

        .btn-arrow svg {
            width: 20px;
            height: 20px;
            opacity: 0.75;
        }

        /* 1. Dev Arama Butonu */
        .btn-call {
            background: linear-gradient(135deg, var(--accent-call), var(--accent-call-hover));
            box-shadow: var(--btn-shadow) rgba(16, 185, 129, 0.35);
        }

        /* 2. WhatsApp Butonu */
        .btn-whatsapp {
            background: linear-gradient(135deg, var(--accent-wa), var(--accent-wa-hover));
            box-shadow: var(--btn-shadow) rgba(37, 211, 102, 0.35);
        }

        /* Secondary Copy Number Row */
        .copy-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            padding: 8px 14px;
            border-radius: 20px;
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .copy-pill:hover, .copy-pill:active {
            background: rgba(148, 163, 184, 0.18);
            color: var(--text-primary);
        }

        .copy-pill svg {
            width: 14px;
            height: 14px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: #10b981;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 18px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

                    </g>
                </svg>
            </div>
            <div class="brand-name">ŠKODA</div>
            <div class="model-name">KAMIQ</div>
        </div>

        <!-- 1 & 4. Plaka Rozeti -->
        <div class="plate-wrapper">
            <div class="plate-box" title="Araç Plakası">
                <div class="plate-tr">
                    <span>★ ★</span>
                    TR
                </div>
                <div class="plate-number" id="plateDisplay">06 DDV 196</div>
            </div>
        </div>

        <!-- Bilgilendirme Notu -->
        <div class="notice-box">
            🚗 Park halinde çıkışınızı kapatıyorsam veya acil bir durum söz konusuysa lütfen aşağıdaki butonlardan doğrudan bana ulaşın.
        </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Numara panoya kopyalandı!</div>

    <script>
        const phoneNumber = "+905534282576";

        function copyNumber() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(phoneNumber).then(showToast);
            } else {
                const temp = document.createElement("input");
                temp.value = phoneNumber;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                document.body.removeChild(temp);
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2200);
        }
    </script>
