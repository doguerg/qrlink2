<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>06 DDV 196 - Sürücüye Ulaşın</title>
    
    <!-- Google Fonts: Turkish License Plate Typeface (Barlow Semi Condensed - DIN Variant) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@700;800;900&display=swap" rel="stylesheet">

    <!-- Meta & Mobile Theme -->
    <meta name="theme-color" content="#090e17" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="06 DDV 196 Araç Sahibi İletişim Kartı - Sürücüye Ulaşın">

    <style>
        :root {
            --bg-page: #090e17;
            --bg-card: rgba(17, 24, 39, 0.90);
            --border-card: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            /* 1. Arama Butonu: Elektrik / iOS Mavisi (WhatsApp ile %100 Ayrışan Kontrast) */
            --accent-call: #2563eb;
            --accent-call-hover: #1d4ed8;
            --accent-call-glow: rgba(37, 99, 235, 0.38);
            
            /* 2. WhatsApp Butonu: Orijinal WhatsApp Yeşili */
            --accent-wa: #25d366;
            --accent-wa-hover: #128c7e;
            --accent-wa-glow: rgba(37, 211, 102, 0.35);
            
            --shadow-card: 0 24px 48px -12px rgba(0, 0, 0, 0.65), 0 0 45px -10px rgba(37, 99, 235, 0.12);
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-page: #f1f5f9;
                --bg-card: rgba(255, 255, 255, 0.96);
                --border-card: rgba(0, 0, 0, 0.06);
                --text-primary: #0f172a;
                --text-secondary: #475569;
                --text-muted: #94a3b8;
                --accent-call-glow: rgba(37, 99, 235, 0.22);
                --accent-wa-glow: rgba(37, 211, 102, 0.2);
                --shadow-card: 0 20px 35px -10px rgba(0, 0, 0, 0.08);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background-image: 
                radial-gradient(circle at 50% 5%, rgba(37, 99, 235, 0.15) 0%, transparent 60%),
                radial-gradient(circle at 50% 95%, rgba(16, 185, 129, 0.08) 0%, transparent 50%);
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-card);
            border-radius: 30px;
            padding: 32px 24px 28px 24px;
            box-shadow: var(--shadow-card);
            text-align: center;
            animation: cardAppear 0.45s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        @keyframes cardAppear {
            from { opacity: 0; transform: translateY(20px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Top Status Chip */
        .top-badge-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .status-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.28);
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            color: #10b981;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulseGreen 2s infinite;
        }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .car-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            background: rgba(148, 163, 184, 0.08);
            border: 1px solid var(--border-card);
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        .car-chip svg {
            width: 13px;
            height: 13px;
            opacity: 0.75;
        }

        /* Main Heading */
        .card-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.6px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .card-prompt {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-secondary);
            margin-bottom: 22px;
            padding: 0 4px;
        }

        /* Authentic Turkish License Plate (Orijinal Plaka Fontu & Düzeni) */
        .plate-container {
            margin: 0 auto 24px auto;
            display: inline-block;
        }

        .plate-bracket {
            background: #0b0f19;
            padding: 5px;
            border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 1px 1px rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        @media (prefers-color-scheme: light) {
            .plate-bracket {
                background: #1e293b;
                box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
            }
        }

        .plate-body {
            display: flex;
            align-items: center;
            background: #ffffff;
            color: #111827;
            border: 2px solid #111827;
            border-radius: 6px;
            padding: 4px 14px 4px 4px;
            box-shadow: inset 0 0 0 1px #e2e8f0;
            user-select: none;
        }

        .plate-tr {
            background: #003399;
            color: #ffffff;
            border-radius: 4px;
            padding: 6px 8px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .plate-tr .tr-text {
            font-family: 'Barlow Semi Condensed', sans-serif;
            font-size: 14px;
            font-weight: 900;
            letter-spacing: 0.8px;
        }

        /* Türk Plaka Yazı Tipi: DIN 1451 / Barlow Semi Condensed */
        .plate-text-group {
            display: flex;
            align-items: center;
            gap: 10px; /* 06 - DDV - 196 arasındaki orijinal boşluk */
            font-family: 'Barlow Semi Condensed', 'DIN Alternate', -apple-system, sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #111827;
            line-height: 1;
            text-transform: uppercase;
        }

        /* Action Buttons Area */
        .actions-list {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .btn-action {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 16px 20px;
            border-radius: 20px;
            text-decoration: none;
            color: white;
            font-weight: 600;
            transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .btn-action:active {
            transform: scale(0.975);
        }

        .btn-left {
            display: flex;
            align-items: center;
            gap: 14px;
            text-align: left;
        }

        .btn-icon-wrap {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35);
        }

        .btn-icon-wrap svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .btn-text-wrap {
            display: flex;
            flex-direction: column;
        }

        .btn-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .btn-desc {
            font-size: 12px;
            opacity: 0.92;
            font-weight: 400;
            margin-top: 2px;
        }

        .btn-arrow svg {
            width: 20px;
            height: 20px;
            opacity: 0.8;
            transition: transform 0.2s;
        }

        /* 1. Arama Butonu: Elektrik Mavisi (Canlı, Prestijli ve Ayrışan Renk) */
        .btn-call {
            background: linear-gradient(135deg, var(--accent-call), var(--accent-call-hover));
            box-shadow: 0 10px 25px -4px var(--accent-call-glow);
        }

        /* 2. WhatsApp Butonu: Orijinal WhatsApp Yeşili */
        .btn-whatsapp {
            background: linear-gradient(135deg, var(--accent-wa), var(--accent-wa-hover));
            box-shadow: 0 10px 25px -4px var(--accent-wa-glow);
        }

        /* Secondary Copy Number Row */
        .copy-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 22px;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(148, 163, 184, 0.08);
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border-card);
            transition: all 0.2s;
        }

        .copy-pill:hover, .copy-pill:active {
            background: rgba(148, 163, 184, 0.16);
            color: var(--text-primary);
        }

        .copy-pill svg {
            width: 14px;
            height: 14px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(50px);
            background: #10b981;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 24px;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Top Status & Vehicle Badge -->
        <div class="top-badge-row">
            <div class="status-chip">
                <span class="status-dot"></span>
                <span>Park Halinde</span>
            </div>
            <div class="car-chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11.1 2 11.5 2 12v4c0 .6.4 1 1 1h2"/>
                    <circle cx="7" cy="17" r="2"/>
                    <path d="M9 17h6"/>
                    <circle cx="17" cy="17" r="2"/>
                </svg>
                <span>Škoda Kamiq</span>
            </div>
        </div>

        <!-- Main Title & Prompt -->
        <h1 class="card-title">Sürücüye Ulaşın</h1>
        <p class="card-prompt">
            Araç konumu veya acil bir durum için aşağıdaki kanallardan doğrudan bana ulaşabilirsiniz.
        </p>

        <!-- Hero License Plate (Orijinal Türk Plakası Tipografisi) -->
        <div class="plate-container">
            <div class="plate-bracket">
                <div class="plate-body" title="06 DDV 196">
                    <div class="plate-tr">
                        <span class="tr-text">TR</span>
                    </div>
                    <div class="plate-text-group" id="plateDisplay">
                        <span>06</span>
                        <span>DDV</span>
                        <span>196</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="actions-list">
            <!-- 1. Dev Arama Butonu (Elektrik Mavisi - Ayrışan Renk) -->
            <a href="tel:+905534282576" class="btn-action btn-call" id="callButton">
                <div class="btn-left">
                    <div class="btn-icon-wrap">
                        <svg viewBox="0 0 24 24">
                            <path d="M6.62 10.79a15.053 15.053 0 006.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/>
                        </svg>
                    </div>
                    <div class="btn-text-wrap">
                        <span class="btn-title">Araç Sahibini Ara</span>
                        <span class="btn-desc">+90 553 428 25 76</span>
                    </div>
                </div>
                <div class="btn-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </a>

            <!-- 2. WhatsApp ile Mesaj Gönder Butonu (Orijinal Yeşil) -->
            <a href="https://wa.me/905534282576?text=Merhaba%2C%2006%20DDV%20196%20plakal%C4%B1%20arac%C4%B1n%C4%B1z%20ile%20ilgili%20ula%C5%9F%C4%B1yorum." class="btn-action btn-whatsapp" id="waButton" target="_blank" rel="noopener">
                <div class="btn-left">
                    <div class="btn-icon-wrap">
                        <svg viewBox="0 0 24 24">
                            <path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2zm5.8 14.15c-.24.67-1.39 1.28-1.92 1.36-.5.08-1.14.12-3.69-.93-3.26-1.35-5.35-4.66-5.51-4.88-.16-.22-1.32-1.76-1.32-3.35 0-1.6 1.04-2.38 1.41-2.75.37-.37.81-.46 1.08-.46.27 0 .54.01.78.02.25.01.59-.1.92.7.34.82 1.16 2.83 1.26 3.04.1.21.17.46.03.73-.13.27-.2.44-.4.67-.2.24-.42.53-.6.71-.2.2-.41.42-.18.82.23.39 1.02 1.68 2.19 2.72 1.51 1.34 2.78 1.76 3.17 1.96.39.19.62.16.85-.1.23-.27.99-1.15 1.25-1.55.26-.39.53-.33.88-.2.36.13 2.27 1.07 2.66 1.27.39.2.65.3.75.46.09.18.09 1.03-.15 1.7z"/>
                        </svg>
                    </div>
                    <div class="btn-text-wrap">
                        <span class="btn-title">WhatsApp ile Yaz</span>
                        <span class="btn-desc">+90 553 428 25 76</span>
                    </div>
                </div>
                <div class="btn-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </a>
        </div>

        <!-- Secondary Copy Helper -->
        <button class="copy-pill" id="copyBtn" onclick="copyNumber()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
            </svg>
            <span>Numarayı Kopyala</span>
        </button>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast">Numara panoya kopyalandı!</div>

    <script>
        const phoneNumber = "+905534282576";

        function copyNumber() {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(phoneNumber).then(showToast);
            } else {
                const temp = document.createElement("input");
                temp.value = phoneNumber;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand("copy");
                document.body.removeChild(temp);
                showToast();
            }
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2200);
        }

        // Akıllı Araç Radarı: Sayfa açıldığında güvenli sunucuya sessiz bildirim
        try {
            fetch("https://dash.dogu.gen.tr/api/qr-scan?card=peri&t=" + Date.now(), { mode: "cors" }).catch(() => {});
        } catch(e) {}
    </script>
</body>
</html>
